name: Export RASC presentation assets

on:
  push:
    branches:
      - codex/rasc-presentation-evidence-20261028
    paths:
      - .github/workflows/export-presentation-assets.yml
  workflow_dispatch:

jobs:
  package-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
      - name: Package presentation evidence
        run: |
          test -d docs/presentations/assets/20261028_rasc_curobo
          tar -czf rasc-presentation-assets-20261028.tar.gz \
            docs/presentations/assets/20261028_rasc_curobo
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: rasc-presentation-assets-20261028
          path: rasc-presentation-assets-20261028.tar.gz
          if-no-files-found: error
          retention-days: 3
