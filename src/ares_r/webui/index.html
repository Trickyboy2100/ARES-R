<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARES-R Scene-Aware Motion</title>
<style>
:root{color-scheme:dark;--bg:#071018;--panel:#101c27;--line:#294052;--cyan:#51d8ff;--green:#55e38e;--orange:#ffad4d;--red:#ff5268;--muted:#91a7b6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8f3fa;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}#ribbon{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:#050b10;border-bottom:1px solid var(--line)}.state{padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:7px}.state b{color:var(--cyan)}#layout{display:grid;grid-template-columns:260px 1fr 310px;height:calc(100vh - 70px)}aside{padding:12px;background:var(--panel);overflow:auto}aside.left{border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line)}h3{margin:8px 0;color:var(--cyan)}button,input,select{width:100%;margin:4px 0;padding:8px;background:#142636;color:#eef8ff;border:1px solid #35526a;border-radius:5px}button:hover{border-color:var(--cyan)}button.stop{border-color:var(--red);color:#ffbdc6}.small{color:var(--muted);font-size:12px;word-break:break-all}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}#view{position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 45%,#112230,#050a0e 72%)}#legend{position:absolute;left:12px;bottom:12px;padding:8px;background:#071018d9;border:1px solid var(--line)}#artlog{height:155px;overflow:auto;white-space:pre-wrap;background:#050b10;padding:8px;border:1px solid var(--line)}label{display:block;margin-top:8px;color:var(--muted)}.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}</style></head>
<body><div id="ribbon"><div class="state">BASE <b id="base">—</b></div><div class="state">SCENE <b id="scene">—</b></div><div class="state">PLANNER <b id="planner">—</b></div><div class="state">EXECUTION <b id="execution">—</b></div></div>
<div id="layout"><aside class="left"><h3>Local Scene</h3><button onclick="post('/api/scene/scan',{arm:arm.value})">Scan</button><button onclick="post('/api/scene/invalidate',{reason:'WEBUI_OPERATOR'})">Invalidate</button><label>Scene policy</label><select id="policy"><option>AUTO_FRESH</option><option>FORCE_RESCAN</option><option>REUSE_IF_VALID</option></select><div id="sceneMeta" class="small"></div><h3>Layers</h3><label><input type="checkbox" id="showCloud" checked> Pointcloud</label><label><input type="checkbox" id="showWorld" checked> Collision primitives</label><label><input type="checkbox" id="showRobot" checked> Dual-arm robot</label><label><input type="checkbox" id="showPath" checked> Target + trajectory</label><div id="legend">cyan: robot · orange: inactive/tool<br>green: support · red: protrusion<br>purple: unknown · white: trajectory</div></aside>
<main id="view"><canvas id="canvas"></canvas></main>
<aside class="right"><h3>Runtime BODY target</h3><label>Arm</label><select id="arm"><option>right</option><option>left</option></select><div class="row"><div><label>X forward (m)</label><input id="targetX" value="0.70"></div><div><label>Y left (m)</label><input id="targetY" value="-0.50"></div></div><label>Z up (m)</label><input id="targetZ" value="1.00"><label>Orientation</label><select id="orientation" onchange="yawRow.style.display=this.value==='LEVEL_YAW_TARGET'?'block':'none'"><option>LEVEL_YAW_FREE</option><option>LEVEL_YAW_TARGET</option><option>CURRENT</option><option>EXPLICIT</option></select><div id="yawRow" style="display:none"><label>Final yaw about BODY +Z (deg)</label><input id="targetYaw" value="0"></div><label>Speed profile</label><select id="speed"><option>right_scene_aware_0_20</option><option>right_ab_demo_0_20</option></select><div class="row"><button onclick="plan()">Plan</button><button onclick="preview()">Preview</button></div><div class="row"><button disabled title="Requires supervised ART/TTY">Execute in ART</button><button class="stop" onclick="post('/api/motion/stop',{})">Stop</button></div><div id="motionMeta" class="small"></div><details><summary>Demo / Regression presets</summary><div class="row"><button onclick="post('/api/task/ab/run-next',{destination:'A'})">Plan A</button><button onclick="post('/api/task/ab/run-next',{destination:'B'})">Plan B</button></div></details><h3>ART shared backend</h3><input id="art" placeholder="motion plan right --xyz 0.70 -0.50 1.00"><button onclick="artCommand()">Run command</button><pre id="artlog"></pre></aside></div>
<script>
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d');let data={},yaw=-.7,pitch=.48,scale=520,drag=null;
async function api(path,opt){let r=await fetch(path,opt);let v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}async function post(path,body){try{let v=await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('artlog').textContent=JSON.stringify(v,null,2);await refresh()}catch(e){$('artlog').textContent=e}}
async function plan(){let xyz=[$('targetX'),$('targetY'),$('targetZ')].map(e=>Number(e.value));if(xyz.some(Number.isNaN))return $('artlog').textContent='Finite BODY XYZ required';let body={arm:$('arm').value,position_m:xyz,orientation:$('orientation').value,speed_profile:$('speed').value,scene_policy:$('policy').value,source:'WEBUI_RUNTIME_XYZ',request_label:'WEBUI_RUNTIME_TARGET'};if(body.orientation==='LEVEL_YAW_TARGET')body.yaw_target_rad=Number($('targetYaw').value)*Math.PI/180;post('/api/motion/plan',body)}async function preview(){let s=await api('/api/motion/status');if(s.plan_id)post('/api/art/command',{command:'motion preview '+s.plan_id})}function artCommand(){post('/api/art/command',{command:$('art').value})}
function project(p){let x=p[0]-.7,y=p[1],z=p[2]-1;let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let a=cy*x-sy*y,b=sy*x+cy*y;return [canvas.width/2+scale*a,canvas.height/2-scale*(cp*z-sp*b)]}function line(a,b,c,w=1){a=project(a);b=project(b);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}function box(center,dims,color){let c=center,d=dims.map(v=>v/2),v=[];for(let x of [-1,1])for(let y of [-1,1])for(let z of [-1,1])v.push([c[0]+x*d[0],c[1]+y*d[1],c[2]+z*d[2]]);for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){let n=0;for(let k=0;k<3;k++)if(Math.abs(v[i][k]-v[j][k])>.0001)n++;if(n===1)line(v[i],v[j],color,1)}}
function draw(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.clearRect(0,0,canvas.width,canvas.height);scale=500*devicePixelRatio;for(let axis of [[[0,0,0],[.35,0,0],'#ff5268'],[[0,0,0],[0,.35,0],'#55e38e'],[[0,0,0],[0,0,.35],'#51d8ff']])line(...axis,2);if($('showCloud').checked)for(let p of data.pointcloud||[]){let a=project(p);ctx.fillStyle='#7894a4';ctx.fillRect(a[0],a[1],1.2*devicePixelRatio,1.2*devicePixelRatio)}if($('showWorld').checked)for(let o of data.collision_primitives||[]){let s=o.source||'',c=s.includes('PROTRUDING')?'#ff5268':s.includes('SUPPORT')?'#55e38e':s.includes('UNKNOWN')?'#b76cff':'#5d95ff';box(o.center_m,o.dims_m.map((v,i)=>v+2*(o.inflation_m||0)),c)}if($('showRobot').checked)for(let o of data.robot_geometry||[]){let d=(o.half_extents_m||[0,0,0]).map(v=>2*v);box(o.center_body_m,d,o.owner&&o.owner.startsWith('right')?'#51d8ff':'#ffad4d')}if($('showPath').checked){let p=data.trajectory||[];for(let i=1;i<p.length;i++)line(p[i-1],p[i],'#fff',3);if(data.target_pose){let a=project(data.target_pose);ctx.fillStyle='#55e38e';ctx.beginPath();ctx.arc(a[0],a[1],7*devicePixelRatio,0,7);ctx.fill()}}}
canvas.onpointerdown=e=>drag=[e.clientX,e.clientY,yaw,pitch];canvas.onpointermove=e=>{if(drag){yaw=drag[2]+(e.clientX-drag[0])*.008;pitch=Math.max(-1.2,Math.min(1.2,drag[3]+(e.clientY-drag[1])*.006));draw()}};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{scale*=e.deltaY>0?.9:1.1;draw()};window.onresize=draw;
async function refresh(){try{let s=await api('/api/system/status');for(let k of ['base','scene','planner','execution'])$(k).textContent=s[k.toUpperCase()];$('sceneMeta').textContent=`epoch ${s.scene_epoch} · base rev ${s.base_pose_revision}\n${s.scene_snapshot_id||'no snapshot'}\nage ${s.pointcloud_age_s==null?'—':s.pointcloud_age_s.toFixed(1)+' s'}`;data=await api('/api/scene/data');$('motionMeta').textContent=JSON.stringify(data.trajectory_metrics||{},null,2);draw()}catch(e){$('artlog').textContent=e}}setInterval(refresh,1500);refresh();
</script></body></html>
