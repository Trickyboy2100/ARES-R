<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">ARES-R 双臂机器人统一坐标系定义</title><desc id="desc">零关节参考姿态下的世界、左右基座和左右TCP坐标系。</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e5edf4"/></linearGradient>
 <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#dc3048"/></marker>
 <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#15995b"/></marker>
 <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2176d9"/></marker>
 <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#e58218"/></marker>
 <marker id="ak" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#526170"/></marker>
 <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".18"/></filter>
 <style>text{font-family:"Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#172432}.h{font-size:34px;font-weight:750}.s{font-size:17px;fill:#536474}.l{font-size:18px;font-weight:700}.n{font-size:14px;fill:#536474}.axis{fill:none;stroke-width:4}.x{stroke:#dc3048}.y{stroke:#15995b}.z{stroke:#2176d9}.dash{stroke:#8798a6;stroke-width:2;stroke-dasharray:7 7;fill:none}.left{stroke:#7657ce;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;fill:none}.right{stroke:#079898;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;fill:none}.jl{fill:#faf8ff;stroke:#6545bd;stroke-width:4}.jr{fill:#f2ffff;stroke:#087e7e;stroke-width:4}.panel{fill:#fff;stroke:#c5d1da;stroke-width:2}</style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><text x="65" y="58" class="h">ARES-R 双臂机器人统一坐标系定义</text><text x="65" y="90" class="s">q₁…q₆ = 0 参考姿态｜世界原点：双臂基座连线中点正下方地面｜+X 北、+Y 西、+Z 上</text>

<!-- ground, vehicle and north -->
<path d="M250 820L770 975 1320 780 800 615Z" fill="#dce5eb" stroke="#b5c2cc" stroke-width="2"/>
<path d="M595 620L800 690 1025 610 820 540 820 750 1025 680 1025 805 820 885 595 800Z" fill="#334858" fill-opacity=".91" filter="url(#sh)"/><path d="M595 620L800 690 1025 610 820 540Z" fill="#687d90" stroke="#263746" stroke-width="3"/><text x="754" y="652" fill="white" font-size="22" font-weight="700">ARES-R</text>
<g fill="#202c36" stroke="#0d151c" stroke-width="3"><rect x="565" y="700" width="42" height="105" rx="15" transform="rotate(-18 586 752)"/><rect x="792" y="820" width="42" height="105" rx="15" transform="rotate(-18 813 872)"/><rect x="1008" y="680" width="42" height="105" rx="15" transform="rotate(18 1029 732)"/><rect x="795" y="555" width="42" height="90" rx="15" transform="rotate(18 816 600)"/></g>
<path d="M810 566l84-43" stroke="#526170" stroke-width="4" marker-end="url(#ak)"/><text x="905" y="525" class="l">北 / 车体前方</text>

<!-- world origin -->
<circle cx="810" cy="820" r="17" fill="#fff" fill-opacity=".72" stroke="#172432" stroke-width="2" stroke-dasharray="4 3"/><circle cx="810" cy="820" r="7" fill="#172432"/><path d="M810 820V500" class="dash"/><g transform="translate(810 820)"><path d="M0 0l75-42" class="axis x" marker-end="url(#ar)"/><text x="83" y="-43" class="l" fill="#dc3048">+X<tspan baseline-shift="sub" font-size="12">W</tspan> 北</text><path d="M0 0l-78-42" class="axis y" marker-end="url(#ag)"/><text x="-150" y="-43" class="l" fill="#15995b">+Y<tspan baseline-shift="sub" font-size="12">W</tspan> 西</text><path d="M0 0v-108" class="axis z" marker-end="url(#ab)"/><text x="12" y="-110" class="l" fill="#2176d9">+Z<tspan baseline-shift="sub" font-size="12">W</tspan> 上</text><path d="M -35 -8 A 36 24 0 1 1 28 -17" fill="none" stroke="#e58218" stroke-width="3" marker-end="url(#ao)"/><text x="-125" y="31" class="n" fill="#bd6508">+yaw：俯视顺时针</text></g><text x="835" y="900" class="l">{W} 世界原点 (0,0,0)</text><text x="835" y="924" class="n">底盘下方地面（透视标出），不是车体棱点</text>

<!-- base supports and zero-pose arms -->
<path d="M650 780V500M970 780V500M650 500H970" stroke="#718392" stroke-width="8" fill="none"/><text x="750" y="485" class="n">基座间距 0.400 m；离地 1.200 m</text>
<ellipse cx="650" cy="500" rx="43" ry="21" fill="#fff" stroke="#6545bd" stroke-width="4"/><ellipse cx="970" cy="500" rx="43" ry="21" fill="#fff" stroke="#087e7e" stroke-width="4"/>
<polyline points="650,495 595,452 520,395 435,332 345,263" class="left"/><polyline points="970,495 1025,452 1100,395 1185,332 1275,263" class="right"/>
<g class="jl"><circle cx="650" cy="495" r="14"/><circle cx="595" cy="452" r="12"/><circle cx="520" cy="395" r="12"/><circle cx="435" cy="332" r="12"/><circle cx="345" cy="263" r="15"/></g><g class="jr"><circle cx="970" cy="495" r="14"/><circle cx="1025" cy="452" r="12"/><circle cx="1100" cy="395" r="12"/><circle cx="1185" cy="332" r="12"/><circle cx="1275" cy="263" r="15"/></g>

<!-- left base frame: Bx southwest, By southeast, Bz up -->
<g transform="translate(650 495)"><path d="M0 0h-67" class="axis x" marker-end="url(#ar)"/><text x="-115" y="-9" class="l" fill="#dc3048">+X<tspan baseline-shift="sub" font-size="12">BL</tspan></text><path d="M0 0v57" class="axis y" marker-end="url(#ag)"/><text x="10" y="70" class="l" fill="#15995b">+Y<tspan baseline-shift="sub" font-size="12">BL</tspan></text><path d="M0 0v-76" class="axis z" marker-end="url(#ab)"/><text x="10" y="-78" class="l" fill="#2176d9">+Z<tspan baseline-shift="sub" font-size="12">BL</tspan></text><path d="M -29 23 A 34 25 0 1 1 25 28" fill="none" stroke="#e58218" stroke-width="3" marker-end="url(#ao)"/></g>
<text x="485" y="583" class="l">{B<tspan baseline-shift="sub" font-size="13">L</tspan>} 左臂基坐标</text><text x="485" y="607" class="n">yaw = −45° = 315°</text><text x="485" y="629" class="n">J1 朝东北；零位整臂朝西北</text>

<!-- right base frame: Bx northwest, By southwest, Bz up -->
<g transform="translate(970 495)"><path d="M0 0v-66" class="axis x" marker-end="url(#ar)"/><text x="10" y="-69" class="l" fill="#dc3048">+X<tspan baseline-shift="sub" font-size="12">BR</tspan></text><path d="M0 0h-67" class="axis y" marker-end="url(#ag)"/><text x="-119" y="-9" class="l" fill="#15995b">+Y<tspan baseline-shift="sub" font-size="12">BR</tspan></text><path d="M0 0v-98" class="axis z" marker-end="url(#ab)"/><text x="10" y="-101" class="l" fill="#2176d9">+Z<tspan baseline-shift="sub" font-size="12">BR</tspan></text><path d="M -29 23 A 34 25 0 1 1 25 28" fill="none" stroke="#e58218" stroke-width="3" marker-end="url(#ao)"/></g>
<text x="1010" y="583" class="l">{B<tspan baseline-shift="sub" font-size="13">R</tspan>} 右臂基坐标</text><text x="1010" y="607" class="n">yaw = +45°</text><text x="1010" y="629" class="n">J1 朝西北；零位整臂朝东北</text>

<!-- calibrated TCP frames in q=0 reference -->
<g transform="translate(345 263)"><path d="M0 0h-65" class="axis x" marker-end="url(#ar)"/><text x="-116" y="-9" class="l" fill="#dc3048">+X<tspan baseline-shift="sub" font-size="12">TL</tspan></text><path d="M0 0l3-55" class="axis y" marker-end="url(#ag)"/><text x="12" y="-55" class="l" fill="#15995b">+Y<tspan baseline-shift="sub" font-size="12">TL</tspan></text><path d="M0 0l-5-40" class="axis z" marker-end="url(#ab)"/><text x="-54" y="-44" class="l" fill="#2176d9">+Z<tspan baseline-shift="sub" font-size="12">TL</tspan></text></g><text x="185" y="338" class="l">{T<tspan baseline-shift="sub" font-size="13">L</tspan>} 左 TCP / Tool 1</text>
<g transform="translate(1275 263)"><path d="M0 0l3 60" class="axis x" marker-end="url(#ar)"/><text x="12" y="74" class="l" fill="#dc3048">+X<tspan baseline-shift="sub" font-size="12">TR</tspan></text><path d="M0 0l-6-37" class="axis y" marker-end="url(#ag)"/><text x="-58" y="-41" class="l" fill="#15995b">+Y<tspan baseline-shift="sub" font-size="12">TR</tspan></text><path d="M0 0l65-5" class="axis z" marker-end="url(#ab)"/><text x="72" class="l" fill="#2176d9">+Z<tspan baseline-shift="sub" font-size="12">TR</tspan></text></g><text x="1240" y="356" class="l">{T<tspan baseline-shift="sub" font-size="13">R</tspan>} 右 TCP / Tool 2</text>

<!-- legend -->
<g transform="translate(55 690)"><rect width="430" height="245" rx="18" class="panel"/><text x="24" y="39" class="l">轴颜色与旋转约定</text><path d="M28 76h77" class="axis x" marker-end="url(#ar)"/><text x="125" y="82" class="l">+X 红</text><path d="M28 116h77" class="axis y" marker-end="url(#ag)"/><text x="125" y="122" class="l">+Y 绿</text><path d="M28 156h77" class="axis z" marker-end="url(#ab)"/><text x="125" y="162" class="l">+Z 蓝</text><path d="M 275 82 A 42 32 0 1 1 325 126" fill="none" stroke="#e58218" stroke-width="3" marker-end="url(#ao)"/><text x="245" y="164" class="n">绕局部 +轴的正旋转</text><text x="245" y="186" class="n">统一遵循右手定则</text><text x="24" y="217" class="n">TCP 轴随姿态变化；此图为 q=0 与现场 Tool 1/2。</text></g>

<!-- top view direction inset -->
<g transform="translate(1090 680)"><rect width="445" height="275" rx="18" class="panel" filter="url(#sh)"/><text x="24" y="39" class="l">俯视方位校验</text><text x="222" y="66" text-anchor="middle" class="n">北 / +X<tspan baseline-shift="sub" font-size="10">W</tspan> / yaw 0°</text><path d="M222 232V82" stroke="#526170" stroke-width="3" marker-end="url(#ak)"/><text x="24" y="165" class="n">西 / +Y<tspan baseline-shift="sub" font-size="10">W</tspan></text><text x="337" y="165" class="n">东 / −Y<tspan baseline-shift="sub" font-size="10">W</tspan></text><path d="M222 174L88 88" class="left"/><text x="37" y="81" class="l" fill="#6545bd">左零位：西北</text><path d="M222 198l134-86" class="right"/><text x="284" y="105" class="l" fill="#087e7e">右零位：东北</text><path d="M 187 229 A 62 47 0 0 0 265 227" fill="none" stroke="#e58218" stroke-width="3" marker-end="url(#ao)"/><text x="222" y="258" text-anchor="middle" class="n" fill="#bd6508">俯视顺时针为 +yaw</text></g>
<text x="55" y="977" class="n">配置源：config/robot_world.json ｜ TCP参考：两台控制器 kine_forward(q=0) ｜ 轴正旋转：右手定则 ｜ 2026-09-04</text>
</svg>
