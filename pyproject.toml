[build-system]
requires = ["setuptools>=44", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ares-r"
version = "0.1.0"
description = "Terminal-first control and commissioning framework for ARES-R"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
ares-r = "ares_r.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
